[project]
name = "myna-server"
version = "0.1.0"
description = "Home server for Myna: transcription and note-writing on your own computer."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Installed by the launcher on the home computer; not needed to run the tests.
gpu = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
]
test = ["pytest>=8"]

[project.scripts]
myna-server = "myna_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myna_server"]

name: TestFlight

# Archives Myna for the App Store and uploads it to TestFlight.
#
# Run it from the Actions tab ("Run workflow") on main. Signing is automatic:
# xcodebuild uses an App Store Connect API key to fetch or create the
# provisioning profile. Repository secrets:
#
#   ASC_KEY_ID          Key ID of an App Store Connect API key       (required)
#   ASC_ISSUER_ID       Issuer ID shown above the key list           (required)
#   ASC_KEY_P8          Contents of the AuthKey_XXXXXXXXXX.p8 file   (required)
#   APPLE_TEAM_ID       Team ID                       (optional, defaults to 9BQDEVHKJZ)
#   DEV_CERT_P12        base64 of an Apple Distribution .p12         (optional)
#   DEV_CERT_PASSWORD   password for that .p12                       (optional)
#
# With the .p12, signing uses that certificate from a temporary keychain.
# Without it, Xcode uses a cloud-managed distribution certificate, which
# needs an API key with the Admin role. An app record for com.lightwave.myna
# must already exist in App Store Connect.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use this workflow's run number)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9BQDEVHKJZ' }}
      CERT_P12: ${{ secrets.DEV_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain download failed"

      - name: Install the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/keys/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/keys/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/keys/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Myna.xcodeproj -scheme Myna -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -skipMacroValidation -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > archive.log 2>&1 || {
              grep -E ': error: |error:' archive.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
              tail -80 archive.log
              exit 1
            }
          echo "Archived build $BUILD_NUMBER."

      - name: Strip statically-linked frameworks from the archive
        # sherpa-onnx ships onnxruntime (and itself) as STATIC frameworks: the
        # "executable" inside the .framework is an ar archive, and its code is
        # already linked into Myna's main binary. Xcode still copies these into
        # the app's Frameworks/ folder, and App Store validation rejects a
        # bundled framework whose executable isn't a real dynamic library
        # (ITMS-90208: "onnxruntime.framework does not support the minimum OS
        # Version"). Remove any such static framework here; nothing loads it at
        # runtime, and the next step (-exportArchive) re-signs the app, so the
        # removal is sealed into a valid signature.
        run: |
          APP="$RUNNER_TEMP/Myna.xcarchive/Products/Applications/Myna.app"
          FWDIR="$APP/Frameworks"
          if [ ! -d "$FWDIR" ]; then
            echo "No Frameworks directory in the archive — nothing to strip."
            exit 0
          fi
          for fw in "$FWDIR"/*.framework; do
            [ -d "$fw" ] || continue
            name="$(basename "$fw" .framework)"
            exe="$fw/$name"
            [ -f "$exe" ] || continue
            # KEEP a framework only when we can positively confirm its executable
            # is a Mach-O DYNAMIC library (those must be embedded, e.g. YbridOpus).
            # Everything else is a static framework whose code is already linked
            # into the app binary; embedding it makes App Store validation reject
            # the build (ITMS-90208), so strip it. Two independent checks so one
            # tool's wording can't cause a miss: `file` says "dynamically linked
            # shared library", or `otool -hv` reports the DYLIB filetype.
            fdesc="$(file -b "$exe" 2>/dev/null || true)"
            is_dynamic=no
            if printf '%s' "$fdesc" | grep -q "dynamically linked shared library"; then is_dynamic=yes; fi
            if otool -hv "$exe" 2>/dev/null | grep -qw DYLIB; then is_dynamic=yes; fi
            echo "Inspecting $name.framework (dynamic=$is_dynamic): $fdesc"
            if [ "$is_dynamic" = yes ]; then
              echo "  -> dynamic framework, keeping it."
            else
              echo "::notice::Removing statically-linked framework $name.framework (already linked into the app binary)"
              rm -rf "$fw"
            fi
          done
          echo "Frameworks remaining in the app bundle:"
          ls "$FWDIR" 2>/dev/null || echo "(none)"
          # Hard stop: a static onnxruntime.framework must never ship — it is the
          # exact bundle App Store validation rejects. If it's still here, the
          # detection missed and we fail now rather than wasting an upload cycle.
          if [ -d "$FWDIR/onnxruntime.framework" ]; then
            echo "::error::onnxruntime.framework is still embedded after stripping — would be rejected (ITMS-90208)."
            exit 1
          fi

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
          echo "### Uploaded Myna build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight once Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

name: TestFlight

# Archives Myna and uploads it to TestFlight — as TWO separate jobs:
#
#   build   archives, normalizes frameworks, and exports a signed .ipa, then
#           saves it as a workflow artifact. This is the slow (~14 min) part and
#           it never talks to App Store Connect's upload endpoint.
#   upload  downloads that .ipa and ships it to TestFlight with altool.
#
# So when App Store Connect is flaky (the recurring "Error Downloading App
# Information"), you re-run ONLY the failed `upload` job — seconds — without
# re-archiving. The `build` artifact is reused.
#
# Run it from the Actions tab ("Run workflow"). Repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8        (required)
#   APPLE_TEAM_ID                                (optional, defaults below)
#   DEV_CERT_P12, DEV_CERT_PASSWORD              (optional local signing cert)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use this workflow's run number)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9BQDEVHKJZ' }}
      CERT_P12: ${{ secrets.DEV_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain download failed"

      - name: Install the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/keys/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/keys/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/keys/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Myna.xcodeproj -scheme Myna -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -skipMacroValidation -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > archive.log 2>&1 || {
              grep -E ': error: |error:' archive.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
              tail -80 archive.log
              exit 1
            }
          echo "Archived build $BUILD_NUMBER."

      - name: Normalize embedded frameworks (arm64-only, matching min OS)
        # Two App Store validation issues with the dynamic SPM binary frameworks
        # Xcode embeds (onnxruntime, SherpaOnnxC, YbridOpus):
        #   1. ITMS-90208 — a framework's Info.plist MinimumOSVersion is lower
        #      than its binary actually supports.
        #   2. A 32-bit (armv7) slice in an old framework (YbridOpus), which is
        #      unsupported on modern iOS and clashes with the app's min OS.
        # The app is arm64-only (iOS 26), so: thin every embedded framework
        # binary to arm64, then set its declared MinimumOSVersion to the app's
        # own minimum. -exportArchive re-signs afterwards, re-sealing the edits.
        run: |
          APP="$RUNNER_TEMP/Myna.xcarchive/Products/Applications/Myna.app"
          FWDIR="$APP/Frameworks"
          if [ ! -d "$FWDIR" ]; then
            echo "No Frameworks directory in the archive — nothing to normalize."
            exit 0
          fi
          APP_MIN="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo 26.0)"
          echo "App MinimumOSVersion: $APP_MIN"
          fail=0
          for fw in "$FWDIR"/*.framework; do
            [ -d "$fw" ] || continue
            name="$(basename "$fw" .framework)"
            plist="$fw/Info.plist"
            exe="$fw/$name"
            [ -f "$plist" ] || continue
            if [ -f "$exe" ]; then
              archs="$(lipo -archs "$exe" 2>/dev/null || echo "")"
              echo "$name.framework archs: $archs"
              if printf ' %s ' "$archs" | grep -q ' arm64 '; then
                for a in $archs; do
                  if [ "$a" != arm64 ]; then
                    lipo "$exe" -remove "$a" -output "$exe" 2>/dev/null || true
                  fi
                done
                echo "  -> after thinning: $(lipo -archs "$exe" 2>/dev/null)"
              fi
            fi
            cur="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || echo '(none)')"
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $APP_MIN" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $APP_MIN" "$plist"
            new="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null)"
            echo "$name.framework MinimumOSVersion: $cur -> $new"
            [ "$new" = "$APP_MIN" ] || { echo "::error::Failed to set MinimumOSVersion for $name.framework"; fail=1; }
          done
          onx="$FWDIR/onnxruntime.framework"
          if [ -d "$onx" ]; then
            v="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$onx/Info.plist" 2>/dev/null)"
            [ "$v" = "$APP_MIN" ] || { echo "::error::onnxruntime.framework MinimumOSVersion is '$v', expected $APP_MIN."; fail=1; }
          fi
          for fw in "$FWDIR"/*.framework; do
            name="$(basename "$fw" .framework)"
            exe="$fw/$name"
            [ -f "$exe" ] || continue
            if lipo -archs "$exe" 2>/dev/null | grep -Eqw 'armv7|armv7s|i386'; then
              echo "::error::$name.framework still contains a 32-bit slice."
              fail=1
            fi
          done
          exit $fail

      - name: Export a signed .ipa (no upload)
        # destination=export produces an App Store-signed .ipa on disk and does
        # NOT contact App Store Connect's upload endpoint, so it can't hit the
        # "Error Downloading App Information" outage. The upload job ships it.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          rm -rf "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
          ipa="$(ls "$RUNNER_TEMP/export"/*.ipa 2>/dev/null | head -1)"
          [ -n "$ipa" ] || { echo "::error::Export produced no .ipa."; exit 1; }
          echo "Exported $ipa"
          cp "$ipa" "$RUNNER_TEMP/Myna.ipa"

      - name: Upload the .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: myna-ipa
          path: ${{ runner.temp }}/Myna.ipa
          if-no-files-found: error
          retention-days: 7

      # Uploading happens here, on the same machine that built it. As a
      # separate job it had to wait for a second Mac runner, and more than once
      # none came free in time, so a finished build never reached TestFlight.
      - name: Install the API key for altool
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Upload to TestFlight (altool, retried)
        run: |
          set -o pipefail
          IPA="$RUNNER_TEMP/Myna.ipa"
          echo "Uploading $IPA"
          max=5
          for attempt in $(seq 1 "$max"); do
            echo "=== Upload attempt $attempt/$max ==="
            if xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log; then
              echo "Upload succeeded on attempt $attempt."
              echo "### Uploaded Myna build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
              echo "It appears in TestFlight once Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt "$max" ]; then
              echo "Retrying in $((attempt * 30))s (likely a transient App Store Connect error)…"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Upload to App Store Connect failed after $max attempts. The .ipa is saved as the 'myna-ipa' artifact."
          exit 1

      - name: Keep build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-logs
          path: |
            archive.log
            export.log
            upload.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

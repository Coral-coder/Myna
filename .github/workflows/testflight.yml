name: TestFlight

# Archives Myna for the App Store and uploads it to TestFlight.
#
# Run it from the Actions tab ("Run workflow") on main. Signing is automatic:
# xcodebuild uses an App Store Connect API key to fetch or create the
# provisioning profile. Repository secrets:
#
#   ASC_KEY_ID          Key ID of an App Store Connect API key       (required)
#   ASC_ISSUER_ID       Issuer ID shown above the key list           (required)
#   ASC_KEY_P8          Contents of the AuthKey_XXXXXXXXXX.p8 file   (required)
#   APPLE_TEAM_ID       Team ID                       (optional, defaults to 9BQDEVHKJZ)
#   DEV_CERT_P12        base64 of an Apple Distribution .p12         (optional)
#   DEV_CERT_PASSWORD   password for that .p12                       (optional)
#
# With the .p12, signing uses that certificate from a temporary keychain.
# Without it, Xcode uses a cloud-managed distribution certificate, which
# needs an API key with the Admin role. An app record for com.lightwave.myna
# must already exist in App Store Connect.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use this workflow's run number)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9BQDEVHKJZ' }}
      CERT_P12: ${{ secrets.DEV_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain download failed"

      - name: Install the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the signing certificate
        if: env.CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/keys/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/keys/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/keys/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Myna.xcodeproj -scheme Myna -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -skipMacroValidation -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > archive.log 2>&1 || {
              grep -E ': error: |error:' archive.log | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
              tail -80 archive.log
              exit 1
            }
          echo "Archived build $BUILD_NUMBER."

      - name: Align embedded framework minimum OS versions
        # Fix ITMS-90208 ("<framework> does not support the minimum OS Version
        # specified in the Info.plist"). The SPM binary frameworks Xcode embeds
        # (onnxruntime, SherpaOnnxC, YbridOpus — all dynamic in the built app)
        # ship an Info.plist whose MinimumOSVersion is LOWER than the binary's
        # actual build minimum, which App Store validation rejects. Set each
        # embedded framework's declared MinimumOSVersion to its binary's real
        # minos (read with vtool/otool), falling back to the app's own minimum.
        # The next step (-exportArchive) re-signs the app and its embedded
        # frameworks, so the edited Info.plist is re-sealed into a valid signature.
        run: |
          APP="$RUNNER_TEMP/Myna.xcarchive/Products/Applications/Myna.app"
          FWDIR="$APP/Frameworks"
          if [ ! -d "$FWDIR" ]; then
            echo "No Frameworks directory in the archive — nothing to align."
            exit 0
          fi
          APP_MIN="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo 26.0)"
          echo "App MinimumOSVersion: $APP_MIN"
          fail=0
          for fw in "$FWDIR"/*.framework; do
            [ -d "$fw" ] || continue
            name="$(basename "$fw" .framework)"
            plist="$fw/Info.plist"
            exe="$fw/$name"
            [ -f "$plist" ] || continue
            # Read the binary's real minimum deployment version.
            minos=""
            if [ -f "$exe" ]; then
              minos="$(vtool -arch arm64 -show-build "$exe" 2>/dev/null | awk '/minos/{print $2; exit}')"
              [ -z "$minos" ] && minos="$(otool -l "$exe" 2>/dev/null | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
            fi
            [ -z "$minos" ] && minos="$APP_MIN"
            cur="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || echo '(none)')"
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $minos" "$plist"
            new="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null)"
            echo "$name.framework MinimumOSVersion: $cur -> $new (binary minos: $minos)"
            [ "$new" = "$minos" ] || { echo "::error::Failed to set MinimumOSVersion for $name.framework"; fail=1; }
          done
          # Hard stop: never ship onnxruntime.framework still declaring the old
          # 15.1 that App Store validation rejects.
          onx="$FWDIR/onnxruntime.framework/Info.plist"
          if [ -f "$onx" ]; then
            v="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$onx" 2>/dev/null)"
            if [ "$v" = "15.1" ] || [ -z "$v" ]; then
              echo "::error::onnxruntime.framework MinimumOSVersion is still '$v' — would be rejected (ITMS-90208)."
              fail=1
            fi
          fi
          exit $fail

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Myna.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
          echo "### Uploaded Myna build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight once Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the API key and keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
